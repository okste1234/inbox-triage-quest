# Render Blueprint: one free web service built from the Dockerfile.
services:
  - type: web
    name: inbox-triage
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: PROVIDER
        value: openai-compatible
      - key: OPENAI_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: MODEL
        value: openai/gpt-oss-20b   # baseline model; Groq's free-tier model list changes, confirm in the console
      - key: OPENAI_API_KEY
        sync: false                   # paste in the Render dashboard, never in git
      - key: MAX_MESSAGES_PER_HOUR
        value: "30"
      - key: MAX_MESSAGES_PER_DAY
        value: "120"   # whole server, per 24 h; keeps strangers from draining the free model quota
      - key: LLM_TIMEOUT_MS
        value: "25000"   # one model call: give up after 25 s (normal calls take 1-6 s) so stalls fail fast
      - key: LLM_MAX_ATTEMPTS
        value: "3"
      - key: REQUEST_DEADLINE_MS
        value: "50000"   # whole page request: show a clear message instead of freezing
